name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-web.yml
      - apps/web/**
      - packages/database/**
      - packages/models/**
      - packages/providers/**
      - package.json
      - bun.lock
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: edgeone-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Web EdgeOne Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Link EdgeOne project
        working-directory: apps/web
        run: bun run edgeone makers link -n opendum -t "$EDGEONE_API_TOKEN"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      - name: Build web
        working-directory: apps/web
        run: bun run build
        env:
          NITRO_PRESET: edgeone_pages
          NUXT_PUBLIC_API_URL: ${{ vars.NUXT_PUBLIC_API_URL }}

      - name: Deploy web to EdgeOne Pages
        working-directory: apps/web
        run: bun run edgeone makers deploy .edgeone -n opendum -a overseas -t "$EDGEONE_API_TOKEN" -e production
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
