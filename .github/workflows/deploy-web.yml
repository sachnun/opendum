name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-web.yml
      - apps/web/**
      - packages/database/**
      - packages/models/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: edgeone-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Web EdgeOne Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy web to EdgeOne Pages
        working-directory: apps/web
        run: pnpm exec edgeone makers deploy -n opendum -a overseas -t "$EDGEONE_API_TOKEN" -e production
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
