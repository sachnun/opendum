name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-web.yml
      - apps/web/**
      - packages/models/package.json
      - packages/models/ranking.ts
      - packages/models/ranking.generated.ts
      - packages/models/sort.ts
      - packages/models/stats.ts
      - packages/providers/**
      - package.json
      - bun.lock
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Web Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: web
    env:
      NUXT_PUBLIC_API_URL: ${{ vars.NUXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        run: bun run generate
        env:
          NITRO_PRESET: cloudflare-pages-static

      - name: Deploy web to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=opendum --branch=main
