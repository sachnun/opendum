name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-web.yml
      - apps/web/**
      - packages/database/**
      - packages/models/**
      - packages/providers/**
      - package.json
      - bun.lock
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Web Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: opendum
      NUXT_PUBLIC_API_URL: ${{ vars.NUXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          test -n "$NUXT_PUBLIC_API_URL"

      - name: Build web
        working-directory: apps/web
        run: bun run generate
        env:
          NITRO_PRESET: cloudflare-pages-static

      - name: Ensure Pages project
        run: |
          set -euo pipefail
          if bunx wrangler pages project list --json | jq -e --arg name "$CLOUDFLARE_PAGES_PROJECT" '.[] | select(.name == $name)' >/dev/null; then
            echo "Pages project $CLOUDFLARE_PAGES_PROJECT already exists"
          else
            bunx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main
          fi

      - name: Deploy web to Cloudflare Pages
        run: bunx wrangler pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
