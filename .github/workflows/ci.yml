name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint --workspace @opendum/dashboard

      - name: Typecheck dashboard
        run: npm run typecheck --workspace @opendum/dashboard

      - name: Build dashboard
        run: npm run build --workspace @opendum/dashboard

  proxy:
    name: Proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/proxy/go.mod
          cache-dependency-path: apps/proxy/go.sum

      - name: Vet proxy
        run: go -C apps/proxy vet ./...

      - name: Test proxy
        run: go -C apps/proxy test ./...

      - name: Build proxy
        run: go -C apps/proxy build ./...
