name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test database
        run: pnpm --filter @opendum/database test

      - name: Typecheck database
        run: pnpm --filter @opendum/database typecheck

      - name: Test models
        run: pnpm --filter @opendum/models test

      - name: Typecheck models
        run: pnpm --filter @opendum/models typecheck

      - name: Lint dashboard
        run: pnpm --filter @opendum/dashboard lint

      - name: Typecheck dashboard
        run: pnpm --filter @opendum/dashboard typecheck

      - name: Build dashboard
        run: pnpm --filter @opendum/dashboard build

  proxy:
    name: Proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/proxy/go.mod
          cache-dependency-path: apps/proxy/go.sum

      - name: Vet proxy
        run: go -C apps/proxy vet ./...

      - name: Test proxy
        run: go -C apps/proxy test ./...

      - name: Build proxy
        run: go -C apps/proxy build ./...
