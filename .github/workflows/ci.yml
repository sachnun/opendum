name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard & proxy
        run: pnpm run lint

      - name: Typecheck packages
        run: |
          pnpm --filter @opendum/database exec tsc --noEmit
          pnpm --filter @opendum/ai exec tsc --noEmit
          pnpm --filter @opendum/proxy typecheck

      - name: Build proxy
        run: pnpm run build:proxy
