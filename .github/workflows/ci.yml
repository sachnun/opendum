name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test web
        run: bun run --filter @opendum/web test

      - name: Typecheck web
        run: bun run --filter @opendum/web check

      - name: Build web
        run: bun run --filter @opendum/web generate
        env:
          NITRO_PRESET: cloudflare-pages-static

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck packages
        run: bun run --filter "./packages/*" --if-present check

      - name: Test packages
        run: bun run --filter "./packages/*" --if-present test

      - name: Typecheck api
        run: bun run --filter @opendum/api check

      - name: Test api
        run: bun run --filter @opendum/api test
