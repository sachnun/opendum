name: Refresh Provider Models

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

jobs:
  refresh-models:
    name: Refresh Provider Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh provider models
        run: bun run --filter @opendum/models refresh --summary "$RUNNER_TEMP/summary.md"

      - name: Regenerate family ranking
        run: bun run --filter @opendum/web family-ranking

      - name: Build commit message
        id: commit_msg
        run: |
          echo 'msg<<EOF' >> "$GITHUB_OUTPUT"
          echo 'chore: refresh provider model registry' >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/summary.md" ]; then
            echo '' >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_OUTPUT"
          fi
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Publish refresh summary
        run: |
          if [ -s "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: ${{ steps.commit_msg.outputs.msg }}
