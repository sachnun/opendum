name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-api.yml
      - apps/api/**
      - packages/**
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: koyeb-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: API Koyeb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: api
    env:
      KOYEB_APP: ${{ vars.KOYEB_APP }}
      KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
      KOYEB_REGION: ${{ vars.KOYEB_REGION }}
      KOYEB_INSTANCE_TYPE: ${{ vars.KOYEB_INSTANCE_TYPE }}
      KOYEB_ORG_ID: ${{ vars.KOYEB_ORG_ID }}
      KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter @opendum/api

      - name: Test api
        working-directory: apps/api
        run: bun test

      - name: Validate Koyeb configuration
        run: |
          test -n "$KOYEB_TOKEN"
          test -n "$KOYEB_APP"
          test -n "$KOYEB_SERVICE"
          test -n "$KOYEB_REGION"
          test -n "$KOYEB_INSTANCE_TYPE"
          test -n "$KOYEB_ORG_ID"
          test -f apps/api/Dockerfile

      - name: Bundle api
        run: bun run --filter @opendum/api build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy api to Koyeb
        env:
          API_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          export KOYEB_TOKEN
          ORG=(--organization "$KOYEB_ORG_ID")
          COMMON_ARGS=(
            --docker "$API_IMAGE"
            --type web
            --instance-type "$KOYEB_INSTANCE_TYPE"
            --regions "$KOYEB_REGION"
            --ports 8000:http
            --routes "/:8000"
            --checks "8000:http:/health"
            --checks-grace-period "8000=30"
          )
          if [ "$KOYEB_INSTANCE_TYPE" = "free" ]; then
            SCALE_ARGS=(--min-scale 0 --max-scale 1)
          else
            SCALE_ARGS=(--min-scale 1 --max-scale 1)
          fi

          retry() {
            local attempts="$1" delay="$2" attempt=1
            shift 2
            until "$@"; do
              if [ "$attempt" -ge "$attempts" ]; then
                echo "failed after $attempt attempts: $*" >&2
                return 1
              fi
              echo "attempt $attempt failed, retrying in ${delay}s: $*" >&2
              attempt=$((attempt + 1))
              sleep "$delay"
            done
          }

          if ! koyeb apps get "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1; then
            retry 5 10 koyeb apps create "$KOYEB_APP" "${ORG[@]}"
          fi

          if koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1; then
            SOURCE=$(koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" -o json)
            if grep -qE '"git"|git:' <<<"$SOURCE"; then
              koyeb services delete "$KOYEB_APP/$KOYEB_SERVICE" "${ORG[@]}"
              for _ in $(seq 1 60); do
                koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1 || break
                sleep 5
              done
            else
              retry 5 15 koyeb services update "$KOYEB_APP/$KOYEB_SERVICE" "${ORG[@]}" "${COMMON_ARGS[@]}" "${SCALE_ARGS[@]}" --wait --wait-timeout 10m
              exit 0
            fi
          fi
          retry 5 15 koyeb services create "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" "${COMMON_ARGS[@]}" "${SCALE_ARGS[@]}" --wait --wait-timeout 10m

      - name: Prune stale image versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: opendum
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 2
