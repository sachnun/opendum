name: Deploy Proxy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-proxy.yml
      - services/proxy/**
      - packages/**
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-proxy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ttl.sh
  IMAGE_TTL: 24h

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Proxy Koyeb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: proxy
    env:
      KOYEB_APP: ${{ vars.KOYEB_APP }}
      KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
      KOYEB_REGION: ${{ vars.KOYEB_REGION }}
      KOYEB_INSTANCE_TYPE: ${{ vars.KOYEB_INSTANCE_TYPE }}
      KOYEB_ORG_ID: ${{ vars.KOYEB_ORG_ID }}
      KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter @opendum/proxy

      - name: Test proxy
        working-directory: services/proxy
        run: bun test

      - name: Validate Koyeb configuration
        run: |
          test -n "$KOYEB_TOKEN"
          test -n "$KOYEB_APP"
          test -n "$KOYEB_SERVICE"
          test -n "$KOYEB_REGION"
          test -n "$KOYEB_INSTANCE_TYPE"
          test -n "$KOYEB_ORG_ID"
          test -f services/proxy/Dockerfile

      - name: Bundle proxy
        run: bun run --filter @opendum/proxy build

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REGISTRY/opendum-proxy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:$IMAGE_TTL"
          docker build -f services/proxy/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "PROXY_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy proxy to Koyeb
        run: |
          set -euo pipefail
          export KOYEB_TOKEN
          ORG=(--organization "$KOYEB_ORG_ID")
          COMMON_ARGS=(
            --docker "$PROXY_IMAGE"
            --type web
            --instance-type "$KOYEB_INSTANCE_TYPE"
            --regions "$KOYEB_REGION"
            --ports 8000:http
            --routes "/:8000"
            --checks "8000:http:/health"
            --checks-grace-period "8000=30"
          )
          if [ "$KOYEB_INSTANCE_TYPE" = "free" ]; then
            SCALE_ARGS=(--min-scale 0 --max-scale 1)
          else
            SCALE_ARGS=(--min-scale 1 --max-scale 1)
          fi
          if ! koyeb apps get "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1; then
            koyeb apps create "$KOYEB_APP" "${ORG[@]}"
          fi
          if koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1; then
            SOURCE=$(koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" -o json)
            if grep -qE '"git"|git:' <<<"$SOURCE"; then
              koyeb services delete "$KOYEB_APP/$KOYEB_SERVICE" "${ORG[@]}"
              for _ in $(seq 1 60); do
                koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1 || break
                sleep 5
              done
            else
              koyeb services update "$KOYEB_APP/$KOYEB_SERVICE" "${ORG[@]}" "${COMMON_ARGS[@]}" "${SCALE_ARGS[@]}" --wait --wait-timeout 10m
              exit 0
            fi
          fi
          koyeb services create "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" "${COMMON_ARGS[@]}" "${SCALE_ARGS[@]}" --wait --wait-timeout 10m
