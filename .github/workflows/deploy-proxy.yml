name: Deploy Proxy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-proxy.yml
      - apps/proxy/**
      - packages/**
      - models/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_run:
    workflows:
      - Refresh Provider Models
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Proxy Koyeb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: proxy
    env:
      KOYEB_APP: ${{ vars.KOYEB_APP || 'opendum-proxy' }}
      KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE || 'proxy' }}
      KOYEB_REGION: ${{ vars.KOYEB_REGION || 'fra' }}
      KOYEB_INSTANCE_TYPE: ${{ vars.KOYEB_INSTANCE_TYPE || 'free' }}
      KOYEB_ORG_ID: ${{ vars.KOYEB_ORG_ID || '527de4ee-1fdb-4d4b-a949-37019a024083' }}
      KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck proxy
        run: pnpm --filter @opendum/proxy typecheck

      - name: Validate Koyeb configuration
        run: |
          test -n "$KOYEB_TOKEN"
          test -n "$KOYEB_APP"
          test -n "$KOYEB_SERVICE"
          test -n "$KOYEB_REGION"
          test -n "$KOYEB_INSTANCE_TYPE"
          test -n "$KOYEB_ORG_ID"
          test -f apps/proxy/Dockerfile

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      # Secrets (DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET) are managed
      # once in the Koyeb dashboard and referenced by the service as
      # {{secret.NAME}}. This workflow only ships code and non-secret env.
      - name: Deploy proxy to Koyeb
        run: |
          set -euo pipefail
          export KOYEB_TOKEN
          ORG=(--organization "$KOYEB_ORG_ID")
          GIT_REPO="github.com/${{ github.repository }}"
          COMMON_ARGS=(
            --git "$GIT_REPO"
            --git-branch main
            --git-builder docker
            --git-docker-dockerfile apps/proxy/Dockerfile
            --type web
            --instance-type "$KOYEB_INSTANCE_TYPE"
            --regions "$KOYEB_REGION"
            --ports 8000:http
            --routes "/:8000"
            --checks "8000:http:/health"
            --checks-grace-period "8000=30"
            --env PORT=8000
            --env HOST=0.0.0.0
            --env TOKEN_REFRESH_INTERVAL_SECONDS=600
          )
          # Free instances only support scale-to-zero (min 0). Paid types keep min 1.
          if [ "$KOYEB_INSTANCE_TYPE" = "free" ]; then
            SCALE_ARGS=(--min-scale 0 --max-scale 1)
          else
            SCALE_ARGS=(--min-scale 1 --max-scale 1)
          fi
          if ! koyeb apps get "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1; then
            koyeb apps create "$KOYEB_APP" "${ORG[@]}"
          fi
          if koyeb services get "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" >/dev/null 2>&1; then
            koyeb services update "$KOYEB_APP/$KOYEB_SERVICE" "${ORG[@]}" "${COMMON_ARGS[@]}" "${SCALE_ARGS[@]}" --wait --wait-timeout 10m
          else
            koyeb services create "$KOYEB_SERVICE" --app "$KOYEB_APP" "${ORG[@]}" "${COMMON_ARGS[@]}" "${SCALE_ARGS[@]}" --wait --wait-timeout 10m
          fi
