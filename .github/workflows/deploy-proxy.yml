name: Deploy Proxy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-proxy.yml
      - apps/proxy/**
      - packages/shared/**
      - models/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: railway-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Proxy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run proxy tests
        run: npm run test:proxy

      - name: Build proxy
        run: npm run build:proxy

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v2.0.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          railway_service_name: opendum-proxy
          service_directory: apps/proxy
