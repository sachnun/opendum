name: Preview Dashboard

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: edgeone-dashboard-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  paths:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Check dashboard paths
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event.workflow_run.pull_requests[0].number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.workflow_run.pull_requests[0].number }}/files" \
            --paginate --jq '.[].filename' | grep -qE \
            '^(apps/dashboard/|packages/(database|models)/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/preview-dashboard\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: paths
    if: needs.paths.outputs.changed == 'true'
    name: Dashboard EdgeOne Pages preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dashboard

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy dashboard preview to EdgeOne Pages
        id: deploy
        working-directory: apps/dashboard
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec edgeone makers deploy -n opendum -a overseas -e preview --json \
            -t "$EDGEONE_API_TOKEN" | tee "$RUNNER_TEMP/deploy.log"
          node -e '
            const fs = require("node:fs");
            const log = fs.readFileSync(process.env.RUNNER_TEMP + "/deploy.log", "utf8");
            const line = [...log.matchAll(/\{"status":"(?:success|error)"[^\n]*?\}/g)].pop();
            if (!line) throw new Error("No deploy result found in CLI output");
            const result = JSON.parse(line[0]);
            if (result.status !== "success") throw new Error(result.error || "EdgeOne deploy failed");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${new URL(result.url).origin}\n`);
          '

      - name: Comment preview link
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ needs.paths.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          marker="<!-- edgeone-dashboard-preview -->"
          body=$(printf '%s\n\n%s\n\nCommit: `%s`' \
            "$marker" "$PREVIEW_URL" "${SHA::7}")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi
