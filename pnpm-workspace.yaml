packages:
  - apps/*
  - services/*
  - packages/*

overrides:
  postcss: ^8.5.28
  typescript-eslint: ^8.62.1
  '@typescript-eslint/eslint-plugin': ^8.62.1
  '@typescript-eslint/parser': ^8.62.1

allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - h3@2.0.1
  - rou3@1.0.0

catalog:
  "@types/node": ^26.1.1
  eslint: ^10.7.0
  eslint-plugin-no-comments: ^1.2.1
  eventsource-parser: ^3.1.0
  p-retry: ^6.2.0
  tsx: ^4.23.13
  typescript: ^6.0.3
  vitest: ^5.0.3
  zod: ^4.4.3
